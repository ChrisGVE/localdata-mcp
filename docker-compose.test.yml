# LocalData MCP - Integration Test Database Services
#
# One container per endpoint dialect, so no dialect is tested blind.
# Ports are offset so nothing collides with a local instance of the same engine.
#
#   docker compose -f docker-compose.test.yml up -d            # all of them
#   docker compose -f docker-compose.test.yml up -d localdata-test-postgres
#   docker compose -f docker-compose.test.yml down -v
#
# Each service is READ-WRITE and seeded by the tests, not by this file: the
# server's own verbs are what should create the tables, because a fixture that
# builds them another way tests the fixture.
#
# SQLite and DuckDB are file-based and need no container.
#
# Oracle is ~2 GB and takes ~90 s to become healthy; SQL Server ~30 s. Both are
# free official images and neither needs credentials to pull. Wait on the
# healthcheck rather than on a timer.

services:
  localdata-test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      # Deliberately hostile, and it is the point rather than a joke. Every
      # character here moves a URL boundary: `@` starts the host, `/` the path,
      # `?` the query, `#` the fragment. One endpoint carrying such a password
      # is what proves the harness passes credentials as *values* all the way to
      # the driver, rather than formatting them into a URL that is then reparsed
      # — see issue #43. `pg_isready` below authenticates by local socket, so
      # the healthcheck is unaffected.
      POSTGRES_PASSWORD: "p@ss:w/rd?x#y"
      POSTGRES_DB: testdb
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  localdata-test-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_DATABASE: testdb
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  localdata-test-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TestPass123!"
    ports:
      - "11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestPass123!' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  localdata-test-oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: testpass
      APP_USER: testuser
      APP_USER_PASSWORD: testpass
    ports:
      - "11521:1521"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 90s

  localdata-test-mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: testpass
      MARIADB_USER: testuser
      MARIADB_PASSWORD: testpass
      MARIADB_DATABASE: testdb
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reached over HTTP on 8123, not over the native protocol on 9000: the
  # dialect that ships with clickhouse-connect is an HTTP one, and only the
  # port it speaks on is published.
  localdata-test-clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: testuser
      CLICKHOUSE_PASSWORD: testpass
      CLICKHOUSE_DB: testdb
    ports:
      - "18123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single node, and insecure on purpose: it is the only service here that
  # authenticates with NO password at all, which is a second auth mode the
  # harness otherwise never exercises. `start-single-node` skips the cluster
  # initialisation a real deployment needs.
  localdata-test-cockroachdb:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure
    ports:
      - "16257:26257"
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # YSQL, YugabyteDB's PostgreSQL-compatible layer, on 5433 — *not* 5432, and
  # not the YCQL Cassandra layer on 9042 which this server does not speak.
  # `yugabyted` brings up master and tserver in one process, which is what makes
  # a single container viable; the flags cut the memory it reserves, because it
  # sizes itself for a dedicated node by default and this machine already runs
  # out at seven containers (issue #46).
  localdata-test-yugabytedb:
    image: yugabytedb/yugabyte:2.25.2.0-b359
    command: >
      bin/yugabyted start --background=false
      --tserver_flags=memory_limit_hard_bytes=1073741824,use_memory_defaults_optimized_for_ysql=false
    ports:
      - "15433:5433"
    healthcheck:
      # `$(hostname)`, not `localhost`: `yugabyted` binds YSQL to the address it
      # advertises, which is the container's own interface, so a loopback probe
      # is refused while the database is answering perfectly well on the
      # published port. A healthcheck that gets this wrong reports the container
      # unhealthy forever and hides a working database behind a red light.
      test: ["CMD-SHELL", "bin/ysqlsh -h $$(hostname) -p 5433 -U yugabyte -d yugabyte -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # A query engine rather than a database: Trino holds nothing itself and reads
  # everything through a *catalog*. The stock image ships four — `memory`,
  # `tpch`, `tpcds` and `jmx` — and `memory` is the only writable one that needs
  # no external system behind it, so it is the catalog these tests address. It
  # keeps its tables in the coordinator's heap and loses them when the container
  # stops, which for a test harness is exactly right.
  #
  # No credentials of any kind: without an authenticator configured Trino
  # accepts whatever username is offered and asks for no password, which makes
  # this the fourth no-auth endpoint here after CockroachDB and YugabyteDB.
  localdata-test-trino:
    image: trinodb/trino:476
    ports:
      - "18080:8080"
    healthcheck:
      # The image's own script, which asks /v1/info and — the part a naive probe
      # misses — insists on `"starting": false`. Trino answers HTTP long before
      # it will accept a query, so a probe that only checks the port reports
      # ready while every statement is still refused with SERVER_STARTING_UP.
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # A column store, and the vendor's own image — `monetdb/monetdb` is the
  # MonetDB B.V. organisation on Docker Hub, not a third-party rebuild.
  #
  # The image creates no database unless it is given an admin password: with
  # `MDB_DB_ADMIN_PASS` unset its entrypoint refuses to start at all rather than
  # coming up empty, which is the good failure. The database it creates is named
  # by `MDB_CREATE_DBS`, defaulting to `monetdb`, and the password is set on the
  # `monetdb` user — so the user, the database and the image all carry the same
  # name here and only their positions tell them apart.
  localdata-test-monetdb:
    image: monetdb/monetdb:latest
    environment:
      MDB_DB_ADMIN_PASS: testpass
    ports:
      - "15000:50000"
    healthcheck:
      # A real query, not `monetdbd`'s own view of itself. `monetdb status`
      # answers over the farm's local socket and reports a database healthy
      # while nothing has yet proved the SQL layer will accept a statement, so
      # this authenticates and selects like a client would. mclient takes its
      # credentials from a file rather than an argument — `DOTMONETDBFILE` names
      # it — which is also why the password never reaches a process list.
      test:
        [
          "CMD-SHELL",
          "printf 'user=monetdb\\npassword=testpass\\n' > /tmp/.mdbhealth && DOTMONETDBFILE=/tmp/.mdbhealth mclient -d monetdb -s 'SELECT 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # A distributed SQL store built on Lucene, and the official `crate` image. It
  # publishes three ports: 4200 is the HTTP endpoint its own driver speaks, 4300
  # is inter-node transport, and 5432 is a PostgreSQL-wire compatibility layer.
  # Only 4200 is published here, because that is the one the dialect uses —
  # addressing the 5432 layer instead would test PostgreSQL's dialect against
  # CrateDB's behaviour, which is the mistake §12 records for CockroachDB.
  #
  # `-Cdiscovery.type=single-node` stops it looking for peers to form a cluster
  # with, and the heap is held down because it sizes itself for a dedicated node
  # by default and this machine runs out of containers before it runs out of
  # dialects (issue #46).
  localdata-test-cratedb:
    image: crate:latest
    command: >
      crate -Cdiscovery.type=single-node
      -Cnetwork.host=_site_
      -Cstats.enabled=true
    environment:
      CRATE_HEAP_SIZE: 512m
    ports:
      - "14200:4200"
    healthcheck:
      # `crash`, the image's own SQL client, running a real statement. The HTTP
      # endpoint answers before the SQL layer will accept one, so probing the
      # port would report ready while every statement is still refused — the
      # same shape Trino's health script gets right by insisting on
      # `"starting": false`.
      #
      # `$(hostname -i)`, not `localhost`, and for the same reason the YugabyteDB
      # entry above says so: `network.host=_site_` binds the container's own
      # interface, so a loopback probe is refused while the database answers
      # perfectly well on the published port. Measured — `curl localhost:4200`
      # returns nothing here and `curl 172.19.0.2:4200` returns the node banner.
      test:
        [
          "CMD-SHELL",
          "crash --hosts http://$$(hostname -i):4200 -c 'SELECT 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # The Firebird Project's own image — `firebirdsql/firebird` is the organisation
  # that publishes the server, not a third-party rebuild.
  #
  # The only endpoint here whose database is a **file the server opens** rather
  # than a name it looks up. `FIREBIRD_DATABASE` is resolved against
  # `FIREBIRD_DATA` (`/var/lib/firebird/data`) and a database is created there on
  # first start, so the URL in tests/endpoints.py has to carry that whole path.
  # `FIREBIRD_USER` without `FIREBIRD_PASSWORD` is refused by the entrypoint
  # rather than silently creating an unreachable user, which is the good failure.
  #
  # Nothing sets `WireCrypt`, and that is deliberate. Firebird 4+ defaults it to
  # `Required`, and the entrypoint offers `FIREBIRD_USE_LEGACY_AUTH` which would
  # reduce it to `Enabled` as a side effect — so the tempting move is to weaken
  # the handshake pre-emptively. Measured instead: the pure-Python driver
  # completes `Srp256` authentication and `WireCrypt=Required` unmodified, so the
  # endpoint is exercised against the server's own defaults and this file makes no
  # security concession to reach it.
  localdata-test-firebird:
    image: firebirdsql/firebird:5
    environment:
      FIREBIRD_ROOT_PASSWORD: testpass
      FIREBIRD_USER: testuser
      FIREBIRD_PASSWORD: testpass
      FIREBIRD_DATABASE: testdb.fdb
    ports:
      - "13050:3050"
    healthcheck:
      # `isql` against `localhost:<path>`, not against the bare path. The path
      # alone opens the file **in embedded mode**, inside the healthcheck's own
      # process, which succeeds while the listening server is still starting and
      # would report a database ready that no client can reach. Prefixing the
      # host forces the connection through the TCP listener, so this probes the
      # thing the published port exposes — the same lesson `$(hostname -i)`
      # records for CrateDB and YugabyteDB, in its other form.
      #
      # `RDB$$DATABASE` carries a doubled `$` because compose interpolates a
      # single one; the statement Firebird receives is `SELECT 1 FROM
      # RDB$DATABASE`, and a constant select without that FROM clause is a syntax
      # error here rather than a shortcut.
      test:
        [
          "CMD-SHELL",
          "echo 'SELECT 1 FROM RDB$$DATABASE;' | isql -b -q -u testuser -p testpass localhost:/var/lib/firebird/data/testdb.fdb >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  # openGauss, and the openGauss project's own image rather than the widely-cited
  # `enmotech/opengauss` third-party rebuild, whose last tag is from 2024.
  #
  # A PostgreSQL fork, and the third engine here on that wire after CockroachDB
  # and YugabyteDB — but the only one that cannot be addressed as PostgreSQL at
  # all. Its version banner does not begin with `PostgreSQL`, so SQLAlchemy's own
  # PGDialect raises while initialising the connection. It is reached through its
  # own dialect on psycopg2; see tests/endpoints.py and docs/CONSTRAINTS.md §21.1.
  #
  # `GS_PASSWORD` is checked by the entrypoint against a complexity rule — eight
  # characters with a lower, an upper, a digit and one of `#?!@$%^&*-` — and the
  # container refuses to initialise without one that passes. The `@` is therefore
  # not decoration: the only passwords this image accepts are ones that contain a
  # URL delimiter, so this endpoint cannot be reached at all by a harness that
  # formats credentials into a URL instead of passing them as values.
  #
  # `GS_USERNAME` matters as much. The initial user `omm` is refused over TCP
  # outright — `FATAL: Forbid remote connection with initial user` — so a normal
  # user has to be created for anything to connect.
  localdata-test-opengauss:
    image: opengauss/opengauss-server:7.0.0-RC3.B025
    environment:
      GS_PASSWORD: "Testpass1@"
      GS_USERNAME: testuser
      GS_DB: testdb
    ports:
      - "15434:5432"
    healthcheck:
      # Over TCP as `testuser`, not over the local socket as `omm`. The socket
      # probe is the shorter command and proves the wrong thing: it succeeds from
      # inside the container while the listener is still starting and while the
      # only user a client could use may not exist yet. This is the Firebird
      # lesson in its second form — there a bare path opened the database in
      # embedded mode, here a local socket bypasses the listener — and both come
      # to the same rule, that a healthcheck must probe what the published port
      # exposes.
      #
      # `-W` puts the password in the container's process list. Accepted here,
      # unlike the MonetDB entry above which routes around it, because openGauss's
      # `gsql` does **not** honour `PGPASSWORD` — measured: it prompts, reads
      # nothing, and fails with `Invalid username/password`. The password is in
      # this file in plaintext regardless.
      test:
        [
          "CMD-SHELL",
          "su - omm -c \"gsql -h 127.0.0.1 -p 5432 -d testdb -U testuser -W 'Testpass1@' -t -A -c 'select 1'\" | grep -q 1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 40s

  # YDB, through the platform's own single-node image. Anonymous — the image
  # configures no authentication at all, so this is the second endpoint after
  # CockroachDB reached with no password rather than with an empty one.
  #
  # **The one service here whose published port may not be offset**, and the
  # reason is worth stating because it looks like carelessness otherwise. A YDB
  # client does not talk to the endpoint it was given: it asks that endpoint for
  # the cluster's node list and connects to what comes back. What comes back is
  # each node's *own* advertised address, and inside Docker that is the
  # container's hostname on its internal port — `d7e126e4eca8:2136`, measured,
  # which resolves nowhere on this machine. Publishing 12136 would leave the
  # handshake succeeding and every statement after it failing to resolve a host.
  #
  # So the advertised address is made true instead of worked around: `hostname:
  # localhost` makes the node advertise `localhost:2136`, and mapping 2136 to
  # 2136 makes that address reach this container. Discovery then works exactly as
  # it does against a real cluster, which is the point — the alternative was to
  # pass `disable_discovery` from the client, and that would put a fact about
  # this compose file into the code path every YDB user runs.
  localdata-test-ydb:
    image: ydbplatform/local-ydb:26.1.1.22
    hostname: localhost
    # No `YDB_USE_IN_MEMORY_PDISKS`, and that is deliberate rather than an
    # omission. It works, and it works exactly once: the cluster configuration is
    # written into the container's filesystem and survives a restart, while the
    # RAM-backed disks it names do not — so a *stopped and started* container
    # comes back with a schemeshard that answers every `CREATE TABLE` with
    # `database doesn't have storage pools at all`, and reports itself unhealthy
    # forever. Measured: healthy on first boot, permanently unhealthy after
    # `docker compose stop` and `up`.
    #
    # This harness runs its containers in batches and rotates between them by
    # stopping and starting, so a service that only survives being created is a
    # trap laid for the next session rather than a saving. The default
    # disk-backed pdisk lives inside the container, is deleted with it, and comes
    # back after a restart — and it costs almost nothing: the container's
    # writable layer measures **6.17 MB** with the pdisk in it (`docker ps
    # --size`), so what the RAM-backed option was saving was not disk.
    ports:
      - "2136:2136"
    healthcheck:
      # The image ships its own `/health_check`, and it is a better probe than
      # anything worth writing here: it runs `select 1`, lists the schema root,
      # then creates and drops a real table — so it answers for DDL as well as
      # for the listener. It is repeated rather than inherited because the
      # image's own settings give it a 10s start period and no retry count, and
      # this cluster takes ~15s to come up on a cold start.
      test: ["CMD-SHELL", "sh /health_check"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s

  # Databend, through the project's own all-in-one image: `bootstrap.sh` starts
  # `databend-meta --single` and `databend-query` side by side in this container.
  # Storage defaults to `fs` under `/var/lib/databend/query`, and that default is
  # left alone deliberately — setting `MINIO_ENABLED` would make the entrypoint
  # *download* a MinIO binary at boot and switch storage to S3, so a test harness
  # would acquire a network dependency and an object store to reach a local file.
  #
  # Only the release-shaped tag is used. This project publishes mostly nightlies;
  # `v1.2.925-patch-4` is the newest tag that is not one, and the organisation is
  # `datafuselabs` — `databendlabs/databend`, which the company's current name
  # suggests, does not exist on Docker Hub.
  #
  # Four ports are exposed and one is published. 8000 carries Databend's own HTTP
  # query handler, which is what `databend-driver` speaks; 3307 is a MySQL-wire
  # compatibility layer and 8124 a ClickHouse one. Publishing either of those
  # would test another engine's dialect against Databend's behaviour, which is
  # the mistake §12 records for CockroachDB and §19 for CrateDB.
  #
  # **`QUERY_DEFAULT_USER` and `QUERY_DEFAULT_PASSWORD` only take effect
  # together**, and what happens without them is not "no password" but a
  # different user: the entrypoint writes a `root` user with
  # `auth_type = "no_password"` when either is missing, and a `localdata` user
  # with `auth_type = "double_sha1_password"` when both are present — at which
  # point `root` does not exist at all (measured: `User 'root'@'%' does not
  # exist.`). Both are set here so this endpoint is reached with a credential
  # rather than becoming the sixth that is not, which is the coverage hole task 23
  # keeps finding. That the HTTP handler accepts a `double_sha1_password` user at
  # all was measured rather than assumed — the scheme is MySQL's, and it is the
  # MySQL-wire port that would obviously honour it.
  #
  # The password carries `:` and `@` on purpose. Unlike openGauss, this image
  # enforces no complexity rule, so nothing forces a delimiter into it — which is
  # exactly why one is put there: it keeps this endpoint proving that credentials
  # reach the driver as values and not as URL syntax. Measured end to end,
  # `URL.create` renders it `l0cal%3Adata%40test` and the driver authenticates.
  localdata-test-databend:
    image: datafuselabs/databend:v1.2.925-patch-4
    environment:
      QUERY_DEFAULT_USER: localdata
      QUERY_DEFAULT_PASSWORD: "l0cal:data@test"
    ports:
      - "18000:8000"
    healthcheck:
      # The image ships no healthcheck, so this is the startup banner's own
      # suggested probe: a real statement over the published port's real
      # transport, authenticated as the only user that exists.
      #
      # `--fail` is not enough on its own and is why the output is grepped. This
      # handler answers **200 with an error body** for a statement it rejects, so
      # a curl that only checks the status code reports a database ready while
      # every query fails. The state field is the thing that actually says the
      # statement ran.
      #
      # The credentials come from the container's own environment rather than
      # being restated here, so this probe cannot drift from the user the
      # entrypoint created. `$$` is compose's escape for a shell `$`.
      test:
        [
          "CMD-SHELL",
          "curl -s -u \"$$QUERY_DEFAULT_USER:$$QUERY_DEFAULT_PASSWORD\" -XPOST http://127.0.0.1:8000/v1/query/ -H 'Content-Type: application/json' -d '{\"sql\":\"SELECT 1\"}' | grep -q '\"state\":\"Succeeded\"' || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

  # -------------------------------------------------------------------------
  # Authentication variants
  #
  # These are not new dialects. Each is an engine already covered above, run a
  # second time under a *different way of authenticating*, because until now
  # every endpoint here was reached exactly one way: a username and a password
  # in the URL, plaintext, over TCP to the loopback interface. A mode that is
  # never exercised is a code path the server has never run.
  #
  # A variant gets its own service only when the mode and the credentialed mode
  # cannot both be configured on one server. Where they can — PostgreSQL reading
  # `PGPASSWORD`, MySQL reading an option file — the mode reuses the container
  # above and adds nothing here.
  # -------------------------------------------------------------------------

  localdata-test-postgres-trust:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustuser
      POSTGRES_DB: trustdb
      # No `POSTGRES_PASSWORD`, and its absence is the subject. `trust` tells
      # PostgreSQL to authenticate nobody: the username is taken at its word and
      # no password is asked for or accepted. It needs its own container because
      # the authentication method is a property of the *server*, so one instance
      # cannot answer both this way and the credentialed way above.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  localdata-test-clickhouse-noauth:
    image: clickhouse/clickhouse-server:25.3
    environment:
      # An **empty** password, which is a third thing: not the credentialed
      # service above, and not the five endpoints reached with no password at
      # all. A URL carrying an empty password renders `user:@host` where an
      # absent one renders `user@host`, and until now nothing here sent the
      # first form at a server that checks it.
      #
      # It needs its own container because the entrypoint's response to
      # `CLICKHOUSE_USER` is to write `<default remove="remove">` into
      # `users.d/default-user.xml` — read out of the running container rather
      # than assumed. One instance cannot hold both users.
      #
      # `default` with no variables at all was the obvious way to get here and
      # does not work, which is worth recording rather than quietly not doing:
      # with `CLICKHOUSE_USER` unset the entrypoint writes a `default` limited to
      # `::1` and `127.0.0.1` — the *container's* loopback — so from the host it
      # is refused, and refused as `password is incorrect, or there is no user
      # with such name`, which names the wrong cause. Naming a user explicitly
      # is what gets `<ip>::/0</ip>` written alongside the empty password.
      CLICKHOUSE_USER: emptypassuser
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: testdb
    ports:
      - "18124:8123"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # A certificate authority, one server certificate and one client certificate,
  # made fresh on every `up` and never committed. It exits when it is done and
  # the TLS service below waits for that exit rather than for a port.
  #
  # Generated rather than checked in for the obvious reason — a private key in a
  # public history is a private key, whatever it was made for — and for a less
  # obvious one: a committed certificate expires, and a harness that starts
  # failing on a date nobody chose is worse than one that makes its own.
  #
  # Two destinations, because the two halves have different owners. The server's
  # key and certificate go into a named volume, where this container can `chown`
  # them to PostgreSQL's uid and `chmod` them to 0600 — PostgreSQL refuses to
  # start on a key anybody else can read. The CA certificate and the *client*
  # key go to a bind mount, because the thing that needs them is the test
  # process on the host.
  localdata-test-tls-ca:
    image: alpine:3
    volumes:
      - localdata-test-tls:/tls
      - ./tests/tls:/public
    # `IP:127.0.0.1` in the SAN is the part that matters and the part most
    # easily left out: `sslmode=verify-full` checks the name the client *asked
    # for* against the certificate, and every URL in this harness asks for
    # 127.0.0.1. A certificate naming only `localhost` verifies under
    # `verify-ca` and fails under `verify-full`, which would leave the stricter
    # of the two modes — the one worth testing — quietly untested.
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache openssl >/dev/null 2>&1
        cd /tls
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -keyout ca.key -out ca.crt -subj "/CN=localdata-test-ca"
        openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr \
          -subj "/CN=localhost"
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
          -out server.crt -days 3650 \
          -extfile /dev/stdin <<'EXT'
        subjectAltName = DNS:localhost, IP:127.0.0.1
        EXT
        # The client certificate's CN *is* the database user it authenticates
        # as. That is what `cert` authentication means: no password is sent and
        # the name in the certificate is the name PostgreSQL logs in.
        openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr \
          -subj "/CN=certuser"
        openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
          -out client.crt -days 3650
        cat > pg_hba.conf <<'HBA'
        # The local socket stays trusting so that `initdb` and the healthcheck
        # can work while every TCP connection is held to TLS.
        local   all all                 trust
        # Ordered, and the order is the point: `certuser` is matched first and
        # must present a certificate, everyone else may send a password — over
        # TLS either way, since there is no plain `host` line at all.
        hostssl all certuser 0.0.0.0/0  cert
        hostssl all certuser ::/0       cert
        hostssl all all      0.0.0.0/0  scram-sha-256
        hostssl all all      ::/0       scram-sha-256
        HBA
        # Authenticating is not the same as being allowed to do anything, and
        # this is where the difference shows: a certificate says who the
        # connection is, and PostgreSQL 15 and later give a fresh role no rights
        # in `public` at all. Without the grant the mode connects perfectly and
        # then cannot create a table, which reads like a broken endpoint rather
        # than an unprivileged one. The entrypoint runs this against
        # `POSTGRES_DB`, so the grant lands where the tests work.
        cat > /tls/certuser.sql <<'SQL'
        CREATE ROLE certuser LOGIN;
        GRANT ALL ON SCHEMA public TO certuser;
        SQL
        chown 70:70 server.key server.crt ca.crt pg_hba.conf certuser.sql
        chmod 600 server.key
        chmod 644 server.crt ca.crt pg_hba.conf certuser.sql
        cp ca.crt client.crt client.key /public/
        chmod 600 /public/client.key
        chmod 644 /public/ca.crt /public/client.crt

  # PostgreSQL that will not accept a connection over anything but TLS, and that
  # accepts two different proofs of identity over it — a password from one user
  # and a certificate from another. Both are modes no other endpoint here
  # exercises, and one of them (`verify-full`) is the *opposite* of what the SQL
  # Server endpoint does with `TrustServerCertificate=yes`.
  localdata-test-postgres-tls:
    image: postgres:16-alpine
    depends_on:
      localdata-test-tls-ca:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: tlsuser
      # The hostile password again, because a mode is not an excuse to make one
      # endpoint easier than the rest.
      POSTGRES_PASSWORD: "p@ss:w/rd?x#y"
      POSTGRES_DB: tlsdb
    volumes:
      - localdata-test-tls:/tls:ro
      # The same volume again, where the image runs what it finds: `certuser`
      # has to exist as a role before a certificate naming it can log in, and
      # `cert` authentication sends no password to create one with. The
      # entrypoint runs the `.sql` and ignores the certificates beside it.
      - localdata-test-tls:/docker-entrypoint-initdb.d:ro
    # `hba_file` points outside PGDATA on purpose: the image's own
    # `POSTGRES_HOST_AUTH_METHOD` writes a `host` line, and `cert` is only legal
    # on a `hostssl` one, so the method this service exists to test cannot be
    # reached through that variable at all.
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - ssl_ca_file=/tls/ca.crt
      - -c
      - hba_file=/tls/pg_hba.conf
    ports:
      - "15436:5432"
    healthcheck:
      # Over the local socket, which the hba file leaves trusting — a TCP probe
      # would need the certificate material this container deliberately does not
      # keep for clients.
      # `-d` is not decoration: without it `pg_isready` asks for a database named
      # after the user, the server answers `FATAL: database "tlsuser" does not
      # exist`, and the probe reports healthy anyway — correctly, since a server
      # that refuses a connection is a server that is up, but it fills the log
      # with a failure that is the probe's own.
      test: ["CMD-SHELL", "pg_isready -U tlsuser -d tlsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A Kerberos realm, so that one endpoint can be reached with no credential in
  # the connection at all — the client proves who it is to a third party first
  # and presents the result. It is the only service here that is not a database
  # and not a one-shot: the client needs it answering for the whole run, because
  # a ticket is obtained at connect time.
  #
  # The service principal is `postgres/127.0.0.1`, an address rather than a
  # name, and that is the finding this service was built around. Asked for
  # `localhost`, the client library canonicalises through DNS first and derives
  # the realm from whatever domain the machine happens to be in — on this one, a
  # Tailscale domain — and then asks for a cross-realm ticket into a realm that
  # does not exist. A literal address is not canonicalised, so the principal is
  # exactly what the URL asked for, and the harness stops depending on the DNS
  # suffix of the machine it runs on.
  localdata-test-kdc:
    image: alpine:3
    environment:
      KRB5_REALM: LOCALDATA.TEST
      KRB5_PRINCIPAL: krbuser
      KRB5_PASSWORD: "kerb:p@ss/word?x#y"
    volumes:
      - localdata-test-krb:/krb
    ports:
      # Kerberos answers on both transports and a client will try either, so
      # both are published. 88 is offset like every other port here.
      - "1088:88/tcp"
      - "1088:88/udp"
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache krb5-server krb5 >/dev/null 2>&1
        cat > /etc/krb5.conf <<EOF
        [libdefaults]
          default_realm = $$KRB5_REALM
          dns_lookup_realm = false
          dns_lookup_kdc = false
          rdns = false
        [realms]
          $$KRB5_REALM = {
            kdc = 127.0.0.1:88
          }
        EOF
        if [ ! -f /krb/.made ]; then
          kdb5_util create -s -P "$$KRB5_PASSWORD" -r "$$KRB5_REALM"
          kadmin.local -q "addprinc -pw $$KRB5_PASSWORD $$KRB5_PRINCIPAL@$$KRB5_REALM"
          kadmin.local -q "addprinc -randkey postgres/127.0.0.1@$$KRB5_REALM"
          rm -f /krb/postgres.keytab
          kadmin.local -q "ktadd -k /krb/postgres.keytab postgres/127.0.0.1@$$KRB5_REALM"
          cat > /krb/pg_hba.conf <<'HBA'
        local   all all             trust
        # `include_realm=0` is what makes the database user `krbuser` rather than
        # `krbuser@LOCALDATA.TEST`, which is not a role and would be refused
        # after a successful authentication — the confusing kind of failure.
        host    all all 0.0.0.0/0   gss include_realm=0
        host    all all ::/0        gss include_realm=0
        HBA
          cat > /krb/krbuser.sql <<'SQL'
        CREATE ROLE krbuser LOGIN;
        GRANT ALL ON SCHEMA public TO krbuser;
        SQL
          chown 70:70 /krb/postgres.keytab /krb/pg_hba.conf /krb/krbuser.sql
          chmod 640 /krb/postgres.keytab
          chmod 644 /krb/pg_hba.conf /krb/krbuser.sql
          touch /krb/.made
        fi
        exec krb5kdc -n
    healthcheck:
      # Asks the KDC for a real ticket using the keytab it just wrote, over the
      # port it actually serves — a process check would report healthy while the
      # database was unbuilt.
      test:
        [
          "CMD-SHELL",
          "kinit -k -t /krb/postgres.keytab postgres/127.0.0.1@$$KRB5_REALM && kdestroy",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # PostgreSQL that accepts a Kerberos ticket and nothing else over TCP.
  localdata-test-postgres-krb:
    image: postgres:16-alpine
    depends_on:
      localdata-test-kdc:
        condition: service_healthy
    environment:
      # These credentials reach nothing over the network: the hba file this
      # service runs with has no password method on any `host` line, so the
      # superuser exists for `initdb` and the healthcheck's local socket only.
      POSTGRES_USER: krbadmin
      POSTGRES_PASSWORD: krbadminpass
      POSTGRES_DB: krbdb
    volumes:
      - localdata-test-krb:/krb:ro
      - localdata-test-krb:/docker-entrypoint-initdb.d:ro
    command:
      - -c
      - krb_server_keyfile=/krb/postgres.keytab
      - -c
      - hba_file=/krb/pg_hba.conf
    ports:
      - "15437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krbadmin -d krbdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Server-side TLS material, in a volume rather than a bind mount so that
  # ownership and mode are Linux's and PostgreSQL will accept the key.
  localdata-test-tls:
  # The Kerberos database, the service keytab and the hba file that names the
  # method. Same reason: a keytab PostgreSQL cannot read is a keytab it will not
  # start with.
  localdata-test-krb:

networks:
  default:
    name: localdata-test-net
