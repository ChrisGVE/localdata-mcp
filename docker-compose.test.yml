# LocalData MCP - Integration Test Database Services
#
# One container per endpoint dialect, so no dialect is tested blind.
# Ports are offset so nothing collides with a local instance of the same engine.
#
#   docker compose -f docker-compose.test.yml up -d            # all of them
#   docker compose -f docker-compose.test.yml up -d localdata-test-postgres
#   docker compose -f docker-compose.test.yml down -v
#
# Each service is READ-WRITE and seeded by the tests, not by this file: the
# server's own verbs are what should create the tables, because a fixture that
# builds them another way tests the fixture.
#
# SQLite and DuckDB are file-based and need no container.
#
# Oracle is ~2 GB and takes ~90 s to become healthy; SQL Server ~30 s. Both are
# free official images and neither needs credentials to pull. Wait on the
# healthcheck rather than on a timer.

services:
  localdata-test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      # Deliberately hostile, and it is the point rather than a joke. Every
      # character here moves a URL boundary: `@` starts the host, `/` the path,
      # `?` the query, `#` the fragment. One endpoint carrying such a password
      # is what proves the harness passes credentials as *values* all the way to
      # the driver, rather than formatting them into a URL that is then reparsed
      # — see issue #43. `pg_isready` below authenticates by local socket, so
      # the healthcheck is unaffected.
      POSTGRES_PASSWORD: "p@ss:w/rd?x#y"
      POSTGRES_DB: testdb
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  localdata-test-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_DATABASE: testdb
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  localdata-test-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TestPass123!"
    ports:
      - "11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestPass123!' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  localdata-test-oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: testpass
      APP_USER: testuser
      APP_USER_PASSWORD: testpass
    ports:
      - "11521:1521"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 90s

  localdata-test-mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: testpass
      MARIADB_USER: testuser
      MARIADB_PASSWORD: testpass
      MARIADB_DATABASE: testdb
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reached over HTTP on 8123, not over the native protocol on 9000: the
  # dialect that ships with clickhouse-connect is an HTTP one, and only the
  # port it speaks on is published.
  localdata-test-clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: testuser
      CLICKHOUSE_PASSWORD: testpass
      CLICKHOUSE_DB: testdb
    ports:
      - "18123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single node, and insecure on purpose: it is the only service here that
  # authenticates with NO password at all, which is a second auth mode the
  # harness otherwise never exercises. `start-single-node` skips the cluster
  # initialisation a real deployment needs.
  localdata-test-cockroachdb:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure
    ports:
      - "16257:26257"
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # YSQL, YugabyteDB's PostgreSQL-compatible layer, on 5433 — *not* 5432, and
  # not the YCQL Cassandra layer on 9042 which this server does not speak.
  # `yugabyted` brings up master and tserver in one process, which is what makes
  # a single container viable; the flags cut the memory it reserves, because it
  # sizes itself for a dedicated node by default and this machine already runs
  # out at seven containers (issue #46).
  localdata-test-yugabytedb:
    image: yugabytedb/yugabyte:2.25.2.0-b359
    command: >
      bin/yugabyted start --background=false
      --tserver_flags=memory_limit_hard_bytes=1073741824,use_memory_defaults_optimized_for_ysql=false
    ports:
      - "15433:5433"
    healthcheck:
      # `$(hostname)`, not `localhost`: `yugabyted` binds YSQL to the address it
      # advertises, which is the container's own interface, so a loopback probe
      # is refused while the database is answering perfectly well on the
      # published port. A healthcheck that gets this wrong reports the container
      # unhealthy forever and hides a working database behind a red light.
      test: ["CMD-SHELL", "bin/ysqlsh -h $$(hostname) -p 5433 -U yugabyte -d yugabyte -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # A query engine rather than a database: Trino holds nothing itself and reads
  # everything through a *catalog*. The stock image ships four — `memory`,
  # `tpch`, `tpcds` and `jmx` — and `memory` is the only writable one that needs
  # no external system behind it, so it is the catalog these tests address. It
  # keeps its tables in the coordinator's heap and loses them when the container
  # stops, which for a test harness is exactly right.
  #
  # No credentials of any kind: without an authenticator configured Trino
  # accepts whatever username is offered and asks for no password, which makes
  # this the fourth no-auth endpoint here after CockroachDB and YugabyteDB.
  localdata-test-trino:
    image: trinodb/trino:476
    ports:
      - "18080:8080"
    healthcheck:
      # The image's own script, which asks /v1/info and — the part a naive probe
      # misses — insists on `"starting": false`. Trino answers HTTP long before
      # it will accept a query, so a probe that only checks the port reports
      # ready while every statement is still refused with SERVER_STARTING_UP.
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # A column store, and the vendor's own image — `monetdb/monetdb` is the
  # MonetDB B.V. organisation on Docker Hub, not a third-party rebuild.
  #
  # The image creates no database unless it is given an admin password: with
  # `MDB_DB_ADMIN_PASS` unset its entrypoint refuses to start at all rather than
  # coming up empty, which is the good failure. The database it creates is named
  # by `MDB_CREATE_DBS`, defaulting to `monetdb`, and the password is set on the
  # `monetdb` user — so the user, the database and the image all carry the same
  # name here and only their positions tell them apart.
  localdata-test-monetdb:
    image: monetdb/monetdb:latest
    environment:
      MDB_DB_ADMIN_PASS: testpass
    ports:
      - "15000:50000"
    healthcheck:
      # A real query, not `monetdbd`'s own view of itself. `monetdb status`
      # answers over the farm's local socket and reports a database healthy
      # while nothing has yet proved the SQL layer will accept a statement, so
      # this authenticates and selects like a client would. mclient takes its
      # credentials from a file rather than an argument — `DOTMONETDBFILE` names
      # it — which is also why the password never reaches a process list.
      test:
        [
          "CMD-SHELL",
          "printf 'user=monetdb\\npassword=testpass\\n' > /tmp/.mdbhealth && DOTMONETDBFILE=/tmp/.mdbhealth mclient -d monetdb -s 'SELECT 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # A distributed SQL store built on Lucene, and the official `crate` image. It
  # publishes three ports: 4200 is the HTTP endpoint its own driver speaks, 4300
  # is inter-node transport, and 5432 is a PostgreSQL-wire compatibility layer.
  # Only 4200 is published here, because that is the one the dialect uses —
  # addressing the 5432 layer instead would test PostgreSQL's dialect against
  # CrateDB's behaviour, which is the mistake §12 records for CockroachDB.
  #
  # `-Cdiscovery.type=single-node` stops it looking for peers to form a cluster
  # with, and the heap is held down because it sizes itself for a dedicated node
  # by default and this machine runs out of containers before it runs out of
  # dialects (issue #46).
  localdata-test-cratedb:
    image: crate:latest
    command: >
      crate -Cdiscovery.type=single-node
      -Cnetwork.host=_site_
      -Cstats.enabled=true
    environment:
      CRATE_HEAP_SIZE: 512m
    ports:
      - "14200:4200"
    healthcheck:
      # `crash`, the image's own SQL client, running a real statement. The HTTP
      # endpoint answers before the SQL layer will accept one, so probing the
      # port would report ready while every statement is still refused — the
      # same shape Trino's health script gets right by insisting on
      # `"starting": false`.
      #
      # `$(hostname -i)`, not `localhost`, and for the same reason the YugabyteDB
      # entry above says so: `network.host=_site_` binds the container's own
      # interface, so a loopback probe is refused while the database answers
      # perfectly well on the published port. Measured — `curl localhost:4200`
      # returns nothing here and `curl 172.19.0.2:4200` returns the node banner.
      test:
        [
          "CMD-SHELL",
          "crash --hosts http://$$(hostname -i):4200 -c 'SELECT 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # The Firebird Project's own image — `firebirdsql/firebird` is the organisation
  # that publishes the server, not a third-party rebuild.
  #
  # The only endpoint here whose database is a **file the server opens** rather
  # than a name it looks up. `FIREBIRD_DATABASE` is resolved against
  # `FIREBIRD_DATA` (`/var/lib/firebird/data`) and a database is created there on
  # first start, so the URL in tests/endpoints.py has to carry that whole path.
  # `FIREBIRD_USER` without `FIREBIRD_PASSWORD` is refused by the entrypoint
  # rather than silently creating an unreachable user, which is the good failure.
  #
  # Nothing sets `WireCrypt`, and that is deliberate. Firebird 4+ defaults it to
  # `Required`, and the entrypoint offers `FIREBIRD_USE_LEGACY_AUTH` which would
  # reduce it to `Enabled` as a side effect — so the tempting move is to weaken
  # the handshake pre-emptively. Measured instead: the pure-Python driver
  # completes `Srp256` authentication and `WireCrypt=Required` unmodified, so the
  # endpoint is exercised against the server's own defaults and this file makes no
  # security concession to reach it.
  localdata-test-firebird:
    image: firebirdsql/firebird:5
    environment:
      FIREBIRD_ROOT_PASSWORD: testpass
      FIREBIRD_USER: testuser
      FIREBIRD_PASSWORD: testpass
      FIREBIRD_DATABASE: testdb.fdb
    ports:
      - "13050:3050"
    healthcheck:
      # `isql` against `localhost:<path>`, not against the bare path. The path
      # alone opens the file **in embedded mode**, inside the healthcheck's own
      # process, which succeeds while the listening server is still starting and
      # would report a database ready that no client can reach. Prefixing the
      # host forces the connection through the TCP listener, so this probes the
      # thing the published port exposes — the same lesson `$(hostname -i)`
      # records for CrateDB and YugabyteDB, in its other form.
      #
      # `RDB$$DATABASE` carries a doubled `$` because compose interpolates a
      # single one; the statement Firebird receives is `SELECT 1 FROM
      # RDB$DATABASE`, and a constant select without that FROM clause is a syntax
      # error here rather than a shortcut.
      test:
        [
          "CMD-SHELL",
          "echo 'SELECT 1 FROM RDB$$DATABASE;' | isql -b -q -u testuser -p testpass localhost:/var/lib/firebird/data/testdb.fdb >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  # openGauss, and the openGauss project's own image rather than the widely-cited
  # `enmotech/opengauss` third-party rebuild, whose last tag is from 2024.
  #
  # A PostgreSQL fork, and the third engine here on that wire after CockroachDB
  # and YugabyteDB — but the only one that cannot be addressed as PostgreSQL at
  # all. Its version banner does not begin with `PostgreSQL`, so SQLAlchemy's own
  # PGDialect raises while initialising the connection. It is reached through its
  # own dialect on psycopg2; see tests/endpoints.py and docs/CONSTRAINTS.md §21.1.
  #
  # `GS_PASSWORD` is checked by the entrypoint against a complexity rule — eight
  # characters with a lower, an upper, a digit and one of `#?!@$%^&*-` — and the
  # container refuses to initialise without one that passes. The `@` is therefore
  # not decoration: the only passwords this image accepts are ones that contain a
  # URL delimiter, so this endpoint cannot be reached at all by a harness that
  # formats credentials into a URL instead of passing them as values.
  #
  # `GS_USERNAME` matters as much. The initial user `omm` is refused over TCP
  # outright — `FATAL: Forbid remote connection with initial user` — so a normal
  # user has to be created for anything to connect.
  localdata-test-opengauss:
    image: opengauss/opengauss-server:7.0.0-RC3.B025
    environment:
      GS_PASSWORD: "Testpass1@"
      GS_USERNAME: testuser
      GS_DB: testdb
    ports:
      - "15434:5432"
    healthcheck:
      # Over TCP as `testuser`, not over the local socket as `omm`. The socket
      # probe is the shorter command and proves the wrong thing: it succeeds from
      # inside the container while the listener is still starting and while the
      # only user a client could use may not exist yet. This is the Firebird
      # lesson in its second form — there a bare path opened the database in
      # embedded mode, here a local socket bypasses the listener — and both come
      # to the same rule, that a healthcheck must probe what the published port
      # exposes.
      #
      # `-W` puts the password in the container's process list. Accepted here,
      # unlike the MonetDB entry above which routes around it, because openGauss's
      # `gsql` does **not** honour `PGPASSWORD` — measured: it prompts, reads
      # nothing, and fails with `Invalid username/password`. The password is in
      # this file in plaintext regardless.
      test:
        [
          "CMD-SHELL",
          "su - omm -c \"gsql -h 127.0.0.1 -p 5432 -d testdb -U testuser -W 'Testpass1@' -t -A -c 'select 1'\" | grep -q 1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 40s

  # YDB, through the platform's own single-node image. Anonymous — the image
  # configures no authentication at all, so this is the second endpoint after
  # CockroachDB reached with no password rather than with an empty one.
  #
  # **The one service here whose published port may not be offset**, and the
  # reason is worth stating because it looks like carelessness otherwise. A YDB
  # client does not talk to the endpoint it was given: it asks that endpoint for
  # the cluster's node list and connects to what comes back. What comes back is
  # each node's *own* advertised address, and inside Docker that is the
  # container's hostname on its internal port — `d7e126e4eca8:2136`, measured,
  # which resolves nowhere on this machine. Publishing 12136 would leave the
  # handshake succeeding and every statement after it failing to resolve a host.
  #
  # So the advertised address is made true instead of worked around: `hostname:
  # localhost` makes the node advertise `localhost:2136`, and mapping 2136 to
  # 2136 makes that address reach this container. Discovery then works exactly as
  # it does against a real cluster, which is the point — the alternative was to
  # pass `disable_discovery` from the client, and that would put a fact about
  # this compose file into the code path every YDB user runs.
  localdata-test-ydb:
    image: ydbplatform/local-ydb:26.1.1.22
    hostname: localhost
    # No `YDB_USE_IN_MEMORY_PDISKS`, and that is deliberate rather than an
    # omission. It works, and it works exactly once: the cluster configuration is
    # written into the container's filesystem and survives a restart, while the
    # RAM-backed disks it names do not — so a *stopped and started* container
    # comes back with a schemeshard that answers every `CREATE TABLE` with
    # `database doesn't have storage pools at all`, and reports itself unhealthy
    # forever. Measured: healthy on first boot, permanently unhealthy after
    # `docker compose stop` and `up`.
    #
    # This harness runs its containers in batches and rotates between them by
    # stopping and starting, so a service that only survives being created is a
    # trap laid for the next session rather than a saving. The default
    # disk-backed pdisk lives inside the container, is deleted with it, and comes
    # back after a restart — and it costs almost nothing: the container's
    # writable layer measures **6.17 MB** with the pdisk in it (`docker ps
    # --size`), so what the RAM-backed option was saving was not disk.
    ports:
      - "2136:2136"
    healthcheck:
      # The image ships its own `/health_check`, and it is a better probe than
      # anything worth writing here: it runs `select 1`, lists the schema root,
      # then creates and drops a real table — so it answers for DDL as well as
      # for the listener. It is repeated rather than inherited because the
      # image's own settings give it a 10s start period and no retry count, and
      # this cluster takes ~15s to come up on a cold start.
      test: ["CMD-SHELL", "sh /health_check"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s

networks:
  default:
    name: localdata-test-net
