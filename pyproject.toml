[project]
name = "localdata-mcp"
version = "3.0.0.dev0"
description = "MCP server giving LLM agents SQL access to local files and databases: eight verbs over 18 file formats and 18 SQL backends."
readme = "README.md"
authors = [
  { name = "Christian C. Berclaz", email = "christian.berclaz@mac.com" },
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  # 3.13 is verified by installing the built wheel and importing it, not by a CI
  # matrix — there is no test workflow, `codeql.yml` uses 3.11 and
  # `publish-to-pypi.yml` uses "3.x", so `requires-python` above is honoured by
  # luck rather than by a gate.
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  # `py.typed` ships in the wheel, so the marker belongs here too.
  "Typing :: Typed",
]
keywords = [
  "mcp", "model-context-protocol", "mcp-server", "database", "sql",
  "sqlite", "duckdb", "postgresql", "clickhouse",
  "csv", "excel", "parquet", "spreadsheet",
  "ai", "llm", "ai-agent",
]

# Deliberately minimal. Every dependency here is load-bearing for the current
# capability set; a file format we cannot read yet does not get a dependency yet.
#
# SQLAlchemy is the exception to that rule and was here from the start on purpose,
# before any backend but SQLite existed. It is a mature, proven abstraction over
# exactly the axis this grew along, and the bet paid: eighteen backends later, each
# one is a different URL and a driver package rather than a rewrite of the
# connection layer. The drivers themselves are optional extras below, one per
# backend, so the base install stays minimal.
#
# Its pool defaults do need care rather than trust — see docs/CONSTRAINTS.md §3.5,
# where a shared connection under rollback-on-return silently discarded 79,807 of
# 200,000 rows. That is a configuration to get right (loader.py documents how),
# not a reason to hand-roll what this library already proved.
#
# Database drivers stay out until the backend they serve is supported; SQLite
# needs none, since SQLAlchemy reaches it through the standard library.
dependencies = [
  "fastmcp>=3.0.0",
  "pandas>=1.3.0",
  "sqlalchemy>=2.0.0",
  # tomllib joined the standard library in 3.11; this is the same parser for 3.10.
  "tomli>=2.0; python_version<'3.11'",
]

# Formats and database drivers are extras, not dependencies. A user reading CSVs
# should not carry a spreadsheet parser, and one querying PostgreSQL should not
# carry an ODS reader. Every format is *known* to the server whether or not its
# library is installed — the refusal names the extra to install, so a missing
# library is an instruction rather than a mystery.
#
# `formats` and `databases` exist because the two groups serve different users:
# local spreadsheet and Parquet work needs no drivers, and warehouse work needs
# no ODS reader. Several extras install together, comma-separated (PEP 508):
#
#     uv tool install 'localdata-mcp[parquet,postgres]'
#     uv tool install 'localdata-mcp[all]'
#
# Quote the brackets — `[` and `]` are glob characters in zsh.
#
# There is no `xml` extra: the stdlib ElementTree parser proved sufficient. Nor
# is there an `html` one any more — HTML was dropped from both registries on
# 2026-07-28, and lxml was the only thing that needed it.
[project.optional-dependencies]
dev = [
  "pytest>=6.0.0",
]

# -- formats ---------------------------------------------------------------
yaml = ["PyYAML>=6.0"]
markdown = ["tabulate>=0.9"]
excel = ["openpyxl>=3.1"]
xls = ["xlrd>=2.0"]
ods = ["odfpy>=1.4"]
numbers = ["numbers-parser>=4.4"]
# One library covers all three columnar formats.
parquet = ["pyarrow>=14.0"]

# -- database drivers ------------------------------------------------------
duckdb = ["duckdb>=1.0", "duckdb-engine>=0.13"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
mssql = ["pyodbc>=5.0"]
oracle = ["oracledb>=2.0"]
# The dialect ships inside the official driver as `clickhousedb`, not as the
# third-party `clickhouse-sqlalchemy` — see docs/CONSTRAINTS.md §11.1.
clickhouse = ["clickhouse-connect[sqlalchemy]>=1.6"]
# CockroachDB speaks the PostgreSQL wire protocol and its dialect rides on the
# same psycopg 3 driver, so this extra is the dialect and nothing else.
cockroachdb = ["sqlalchemy-cockroachdb>=2.0.4", "psycopg[binary]>=3.1"]
# The dialect ships inside Trino's own client under the `sqlalchemy` extra, as
# `trino.sqlalchemy`. The standalone `sqlalchemy-trino` distribution is a
# different project, last released in 2022 and deprecated by its own author in
# favour of this one — see docs/CONSTRAINTS.md §16.1.
trino = ["trino[sqlalchemy]>=0.330"]
# `sqlalchemy-monetdb` is MonetDB's own — it lives under the github.com/MonetDB
# organisation — and is the only dialect for this database; `pymonetdb`, which it
# requires and which is the actively maintained half (1.9.1, 2026-07), is a DB-API
# driver and registers no dialect of its own.
#
# The upper-bounded `setuptools` is a *defect in the dialect*, carried here
# because the alternative is that it cannot be imported at all. Its package
# `__init__` imports `pkg_resources` — only to read its own version — and declares
# no dependency that would provide it. `pkg_resources` shipped inside setuptools
# until **82.0.0**, which removed it, so the bound is measured rather than
# guessed. This is the only version ceiling in this file; see
# docs/CONSTRAINTS.md §18.1 before relaxing it.
monetdb = ["sqlalchemy-monetdb>=2.0", "setuptools<82"]
# Crate.io's own dialect, and it brings its own driver: `crate` speaks CrateDB's
# HTTP endpoint on 4200 rather than the PostgreSQL wire the same server also
# offers on 5432, so no PostgreSQL driver is involved and none is pulled in.
cratedb = ["sqlalchemy-cratedb>=0.43"]
# Two dialects exist for Firebird and this is the one that can be reached from
# here. `sqlalchemy-firebird` is the older and more established of the two, but
# it rides on `firebird-driver`, which is a ctypes binding to Firebird's own
# `libfbclient` — a native library with no wheel, no Homebrew formula, and only a
# system-wide installer to supply it. Measured rather than assumed: with
# `firebird-driver` installed and nothing else, a connection raises `The location
# of Firebird Client Library could not be determined.`
#
# `sqlalchemy-firebirdsql` rides on `firebirdsql` instead, which speaks the wire
# protocol in pure Python and needs no native library at all. It is not a shim:
# it is the same dialect base, ported, co-authored by `sqlalchemy-firebird`'s
# author and maintained by the driver's. Younger, though — 0.1.0, sdist only —
# and that is the cost this choice carries. See docs/CONSTRAINTS.md §20.1.
#
# The driver is not named here: the dialect requires it, and naming it again
# would let the two drift.
firebird = ["sqlalchemy-firebirdsql>=0.1"]
# The **second PostgreSQL driver family** in this project, and the only extra that
# adds one. YugabyteDB's entry in tests/endpoints.py declined exactly this cost
# and was addressed as plain PostgreSQL instead; openGauss cannot be, and the
# difference is measured rather than argued. Its version banner is
# `(openGauss 7.0.0-RC3 build …)` — it does not begin with `PostgreSQL x.y`, so
# SQLAlchemy's own PGDialect raises `AssertionError: Could not determine version
# from string` while *initialising the connection*. Authentication succeeds; the
# dialect kills it afterwards. There is no plain-PostgreSQL route to this database.
#
# `opengauss-sqlalchemy` is the openGauss project's own and registers psycopg2
# drivers only. Unlike `psycopg2-yugabytedb` — the pinned fork that decided
# YugabyteDB's addressing — `psycopg2-binary` publishes ordinary wheels, so the
# cost here is a second driver family and nothing worse. See
# docs/CONSTRAINTS.md §21.1.
opengauss = ["opengauss-sqlalchemy>=2.4", "psycopg2-binary>=2.9"]
# YDB, through the YDB platform's own dialect. Pure Python the whole way down —
# the dialect requires `ydb-dbapi`, which requires the `ydb` SDK, and all three
# are Yandex's own and Apache-2.0. There is no rival package and nothing native
# to install, which after Firebird's `libfbclient` is worth noticing rather than
# assuming.
#
# The dialect registers itself as **`yql`** — after YDB's query language, not
# after the engine or the driver — while also registering `ydb` as a URL scheme
# for the same class. So a URL says `yql+ydb://` and `Dialect.name` reads `yql`,
# which is the third distinct way a dialect name has failed to be an identity in
# this project. See docs/CONSTRAINTS.md §22.1.
#
# Neither `ydb` nor `ydb-dbapi` is named here: the dialect requires both, and
# naming them again would let the three drift.
ydb = ["ydb-sqlalchemy>=0.1.22"]
# Databend, through Databend's own dialect. `databend-sqlalchemy` is the only
# SQLAlchemy dialect for this engine — `sqlalchemy-databend` does not exist on
# PyPI, and `databend-py` is a DB-API driver that registers no dialect — so
# step 1's shim question has no second candidate to weigh.
#
# The driver it rides on, `databend-driver`, is a Rust extension and therefore
# the first *native* dependency here since Firebird's `libfbclient` sent that
# entry to a pure-Python dialect. It is not the same cost: it publishes
# `cp39-abi3` wheels for macOS x86_64 and arm64 and for both manylinux
# architectures, so nothing is compiled and no system library is needed. The
# `local` extra — which would pull in an embedded `databend` engine — is
# deliberately not requested; this endpoint is reached over the wire.
#
# The driver is not named here: the dialect requires it, and naming it again
# would let the two drift.
databend = ["databend-sqlalchemy>=0.5.5"]
# Exasol, through Exasol's own dialect on Exasol's own driver — the first entry
# here where the adapter, the driver and the database all come from one vendor,
# so step 1's shim question has nothing to weigh and neither package can be
# abandoned without the other going with it.
#
# `pyexasol` is not named here: the dialect requires it (`pyexasol>=0.26,<3.0`),
# and naming it again would let the two drift. It brings `websocket-client` and
# `cryptography`, and nothing native: the wire protocol is a WebSocket carrying
# JSON, which is why this endpoint costs no system library at all — the opposite
# end of the range from Db2's clidriver (docs/CONSTRAINTS.md §24).
#
# The dialect also registers a `turbodbc` and a `pyodbc` driver, and neither is
# requested: both would put a system ODBC driver manager back in the way of an
# endpoint that does not need one.
exasol = ["sqlalchemy-exasol>=7.1"]

# -- aggregates ------------------------------------------------------------
formats = [
  "localdata-mcp[yaml,markdown,excel,xls,ods,numbers,parquet]",
]
databases = [
  "localdata-mcp[duckdb,postgres,mysql,mssql,oracle,clickhouse,cockroachdb,trino,monetdb,cratedb,firebird,opengauss,ydb,databend,exasol]",
]
all = [
  "localdata-mcp[formats,databases]",
]

[project.urls]
Homepage = "https://github.com/chrisgve/localdata-mcp"
Repository = "https://github.com/chrisgve/localdata-mcp"
"Bug Tracker" = "https://github.com/chrisgve/localdata-mcp/issues"

[project.scripts]
localdata-mcp = "localdata_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["localdata_mcp*"]

[tool.setuptools.package-data]
localdata_mcp = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["localdata_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: volume and timing tests; excluded with -m 'not slow'",
    # Every one of these skips itself when its container is not answering, so
    # the marker is not needed to keep a Docker-free run green. It is here to
    # make the reverse selection possible: -m endpoint runs only the dialects.
    "endpoint: needs a database container from docker-compose.test.yml",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
