[project]
name = "localdata-mcp"
version = "3.0.0.dev0"
description = "MCP server giving LLM agents SQL access to local files and databases."
readme = "README.md"
authors = [
  { name = "Christian C. Berclaz", email = "christian.berclaz@mac.com" },
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "mcp", "model-context-protocol", "mcp-server", "database",
  "sqlite", "csv", "sql", "ai", "llm", "ai-agent",
]

# Deliberately minimal. Every dependency here is load-bearing for the current
# capability set; a format or engine that is not supported yet does not get a
# dependency yet.
#
# SQLite is reached through the stdlib `sqlite3` module, not SQLAlchemy. Beyond
# being one less dependency, this avoids inheriting connection-pool semantics
# that are actively dangerous for our access pattern — see docs/CONSTRAINTS.md
# §3.5, where a pool's default rollback-on-return silently discarded 79,807 of
# 200,000 rows. When a non-SQLite engine lands, the abstraction belongs behind
# the source seam rather than under every call.
dependencies = [
  "fastmcp>=3.0.0",
  "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/chrisgve/localdata-mcp"
Repository = "https://github.com/chrisgve/localdata-mcp"
"Bug Tracker" = "https://github.com/chrisgve/localdata-mcp/issues"

[project.scripts]
localdata-mcp = "localdata_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["localdata_mcp*"]

[tool.setuptools.package-data]
localdata_mcp = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["localdata_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: volume and timing tests; excluded with -m 'not slow'",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
