[project]
name = "localdata-mcp"
version = "3.0.0.dev0"
description = "MCP server giving LLM agents access to databases, files, graphs, and a full data science toolkit — 71 tools across 13 database types and 20+ file formats."
readme = "README.md"
authors = [
  { name = "Christian C. Berclaz", email = "christian.berclaz@mac.com" },
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "mcp", "model-context-protocol", "mcp-server", "database", "graph", "graphml",
  "spreadsheet", "csv", "json", "yaml", "toml", "ai", "assistant",
  "data-science", "llm", "claude", "anthropic", "ai-agent",
  "chatgpt", "copilot", "gemini", "cursor", "windsurf",
]
# Core tier per ARCHITECTURE.md 7.1 — SQL engines, core file formats,
# kv/graph/tree stores, the scientific stack, and the two version-pinned
# security-critical libraries (asteval, sqlglot). Deliberately absent:
# prometheus_client / python-json-logger (metrics capability dropped in v3),
# tiktoken / ijson / ruptures (deferred — not in the 7.1 core list), and the
# geospatial set (moved to the [geospatial] extra).
dependencies = [
  # MCP framework and data backbone
  "fastmcp>=3.0.0",
  "pandas>=1.3.0",
  "numpy>=1.21.0",
  # SQL engines (core floor: SQLite via stdlib, PostgreSQL, MySQL, DuckDB)
  "sqlalchemy>=1.4.0",
  "psycopg2-binary",
  "mysql-connector-python",
  "duckdb>=1.0.0",     # newly declared — was used but undeclared pre-v3
  # Configuration and runtime plumbing
  "pyyaml>=5.4.0",
  "toml>=0.10.0",
  "tomli>=2.0.1; python_version < '3.11'",  # NX-2 loaders: tomllib backport
  "psutil>=5.8.0",     # memory usage monitoring
  "pydantic>=2.0.0",   # I/O-boundary validation
  "python-dotenv>=1.0.0",
  # Core file formats
  "openpyxl>=3.0.0",   # Excel .xlsx/.xlsm
  "defusedxml>=0.7.0", # XML parse hardening
  "xlrd>=2.0.0",       # legacy Excel .xls
  "odfpy>=1.4.0",      # LibreOffice Calc .ods
  "numbers-parser>=4.0.0", # Apple Numbers
  "h5py>=3.0.0",       # HDF5
  "pyarrow>=10.0.0",   # CSV/Parquet/Feather/Arrow
  "lxml>=4.6.0",       # XML
  # Logging
  "structlog>=23.0.0", # structured logging, stderr-only in v3
  # Graph/tree and RDF/SPARQL stores (core, not extras-gated)
  "networkx>=3.0",
  "pydot>=2.0.0",
  "rdflib>=7.0.0",
  "SPARQLWrapper>=2.0.0",
  # Scientific stack
  "scipy>=1.9.0",
  "scikit-learn>=1.1.0",
  "statsmodels>=0.13.0",
  # Security-critical, exact-pinned; CI asserts pin shape and lock agreement
  "asteval==1.0.9",    # safe-AST expression evaluation
  "sqlglot==30.13.0",  # SQL AST allow-list validation
  # Visualization
  "matplotlib>=3.8.0", # Agg headless backend, OO API only
  "seaborn>=0.13.0",   # palette provider only (pure color lists), never global set_theme
]

# Extras tiers per ARCHITECTURE.md 7.1 — one extra, one concern.
[project.optional-dependencies]
dev = [
  "pytest>=6.0.0",
  "pytest-cov",
  "mypy",              # blocking in v3 CI, not advisory
  "pandas-stubs",
  "types-toml",
  "types-PyYAML",
  "hypothesis>=6.0.0", # NFR-507 property suites (merge/pin/env round-trip)
]
geospatial = [
  # Native-code, heaviest footprint — the whole geospatial domain is opt-in.
  "rasterio>=1.3.0",
  "rtree>=1.0.0",
  "scikit-gstat>=1.0.0",    # imports as `skgstat` (geostatistics/variograms)
  "geopandas>=0.12.0",
  "shapely>=2.0.0",
  "fiona>=1.9.0",
  "pyproj>=3.4.0",
]
umap = [
  "umap-learn>=0.5.0",      # UMAP dimensionality reduction
]
mssql = [
  "pyodbc>=5.0.0",          # MS SQL Server via ODBC
  "pymssql>=2.2.0",         # MS SQL Server native driver
]
enterprise = [
  "oracledb>=2.0.0",        # Oracle Database (licensed test target)
]
modern-databases = [
  "redis>=6.0.0",           # Redis key-value store
  "elasticsearch>=9.0.0",    # Elasticsearch search engine
  "pymongo>=4.0.0",          # MongoDB document database
  "influxdb-client>=1.40.0", # InfluxDB time-series database
  "neo4j>=5.0.0",           # Neo4j graph database
  "couchdb>=1.2.0",         # CouchDB document database
]

[project.urls]
Homepage = "https://github.com/chrisgve/localdata-mcp"
Repository = "https://github.com/chrisgve/localdata-mcp"
Documentation = "https://localdata-mcp.readthedocs.io"
"Bug Tracker" = "https://github.com/chrisgve/localdata-mcp/issues"

[project.scripts]
localdata-mcp = "localdata_mcp.localdata_mcp:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["localdata_mcp*"]

[tool.setuptools.package-data]
localdata_mcp = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["localdata_mcp"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests requiring test fixtures or external services",
    "influxdb: tests requiring InfluxDB",
    "neo4j: tests requiring Neo4j",
    "couchdb: tests requiring CouchDB",
]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
