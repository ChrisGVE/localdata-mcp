name: Offline test suite

# Everything that does not need a database container. The endpoint tests need
# the engines in docker-compose.test.yml and are run by hand (CONTRIBUTING.md).
on:
  push:
    branches: [ "new-v3" ]
  pull_request:
    branches: [ "new-v3" ]

permissions:
  contents: read

jobs:
  offline-tests:
    name: pytest -m "not endpoint"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install from the lock file, every extra
        run: uv sync --all-extras --frozen --python 3.12
      - name: Run the offline suite
        run: uv run --frozen python -m pytest -m "not endpoint" -q
