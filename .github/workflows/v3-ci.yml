# v3 CI — gates for the NEW tree only (src/localdata_mcp/{nexus,ingest,
# explore,process,visualize,testbench} and tests/v3). Legacy packages are
# excluded from every job here until E15 deletes them; the legacy workflows
# keep serving main.
#
# Two numeric gates live HERE and only here (their single configuration home):
#   - coverage floor: 85 (--cov-fail-under below) — never restated in test code
#   - CVE gate: PR-blocking at CVSS >= 7.0 (--threshold below), all severities
#     reported by the checker script
name: v3 CI

on:
  push:
    branches: [v3, main]
  pull_request:
    branches: [v3, main]

env:
  UV_PYTHON: "3.12"

jobs:
  mypy:
    name: mypy (new paths, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen --extra dev
      - name: Type-check the v3 tree
        # The two server/ files are E2's new-tree modules living beside
        # legacy files (nexus/gated_tree.py GUARDED_EXTRA_FILES); the
        # rest of server/ stays legacy-excluded until E15.
        run: >
          uv run mypy
          src/localdata_mcp/nexus
          src/localdata_mcp/ingest
          src/localdata_mcp/explore
          src/localdata_mcp/process
          src/localdata_mcp/visualize
          src/localdata_mcp/output
          src/localdata_mcp/testbench
          src/localdata_mcp/server/fd_guard.py
          src/localdata_mcp/server/mcp_app.py

  tests:
    name: pytest + coverage floor (new paths)
    runs-on: ubuntu-latest
    env:
      # NFR-508 per-PR results-store integration: the emit plugin
      # (batteries/conftest.py) writes one per-worker file here during
      # the run, and the merge step below folds it into the canonical
      # store. GITHUB_SHA is set by Actions; LOCALDATA_DATASET_HASH is
      # pinned from the committed oracle manifest by the step below (E14.1).
      LOCALDATA_RESULTS_STORE_DIR: ${{ github.workspace }}/results-workers
      LOCALDATA_RESULTS_RUN_ID: pr-${{ github.run_id }}
      # NFR-504 core DB fixtures: the postgres/mysql `services:` below are
      # reachable at these DSNs (drivers ship in the base install). Their
      # presence un-skips the base + security batteries' dockerized rows,
      # which self-seed through the endpoint. MSSQL/Oracle are extras-gated
      # (fixture-tested nightly), so their DSNs are absent here and those
      # rows deny statically without a connection.
      LOCALDATA_TEST_POSTGRES_DSN: postgresql+psycopg2://testuser:testpass@localhost:5432/testdb
      LOCALDATA_TEST_MYSQL_DSN: mysql+mysqlconnector://testuser:testpass@localhost:3306/testdb
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen --extra dev
      - name: Wait for the fixture databases
        # E14.2: the runner already gates on service health, but the fixture
        # script is the NFR-504 "exercised in CI" hook — it confirms both
        # core backends accept connections at their DSNs before the batteries
        # (which self-seed through them) run.
        run: uv run python scripts/build_db_fixtures.py --wait --tier core
      - name: Pin the oracle-dataset provenance hash
        # E14.1: LOCALDATA_DATASET_HASH is the committed manifest's combined
        # hash. --print-hash reads the manifest only (no network / no fetch),
        # so a manifest change moves it and the results store records exactly
        # which oracle-data revision produced this run's outcomes.
        run: |
          HASH=$(uv run python scripts/build_oracle_datasets.py --print-hash)
          echo "LOCALDATA_DATASET_HASH=$HASH" >> "$GITHUB_ENV"
      - name: Run the v3 suite with the coverage floor
        # The base battery's accreted slices (E8.5, incl. the generated
        # contract stubs), the domain battery's E10 slices, the security
        # battery (NFR-502b — all NFR-1xx rows; the pg/mysql rows skip
        # gracefully when the E14.2 fixture DSNs are absent), the pipeline
        # length-2 exhaustive tier, and the perf smoke tier (E9.5's
        # discovery floor) run per-PR alongside the unit suite — S7.4's
        # cadence. `-m "not nightly"` holds the exhaustive lengths-3-4 and
        # stretch tiers back to v3-nightly.yml.
        run: >
          uv run pytest tests/v3/ src/localdata_mcp/testbench/batteries/base/
          src/localdata_mcp/testbench/batteries/domain/
          src/localdata_mcp/testbench/batteries/security/
          src/localdata_mcp/testbench/batteries/pipeline/
          src/localdata_mcp/testbench/batteries/perf_memory/
          -m "not nightly"
          --cov=src/localdata_mcp/nexus
          --cov=src/localdata_mcp/ingest
          --cov=src/localdata_mcp/explore
          --cov=src/localdata_mcp/process
          --cov=src/localdata_mcp/visualize
          --cov=src/localdata_mcp/testbench
          --cov-report=term-missing
          --cov-fail-under=85
      - name: Merge per-worker results into the canonical store
        # Exercises the E14.4 post-job merge (NFR-508); the canonical
        # store is uploaded so the batch-then-diagnose gate and the
        # nightly longitudinal comparison can read this run's outcomes.
        run: >
          uv run python scripts/merge_battery_results.py
          --canonical results-canonical.db
          "${{ github.workspace }}/results-workers/*.db"
      - name: Upload the canonical results store
        uses: actions/upload-artifact@v4
        with:
          name: battery-results-${{ github.run_id }}
          path: results-canonical.db
          if-no-files-found: warn

  pip-audit:
    name: dependency CVE gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export the locked dependency closure
        run: uv export --frozen --all-extras --no-emit-project -o requirements-audit.txt
      - name: Audit the locked closure
        # pip-audit exits non-zero on ANY finding; the threshold gate below
        # decides blocking, so findings must not fail this step directly.
        run: >
          uvx pip-audit -r requirements-audit.txt --no-deps -f json -o audit.json
          || echo "pip-audit reported findings; threshold gate decides"
      - name: Apply the CVSS threshold gate
        run: >
          uv run --no-project --with cvss python
          scripts/check_audit_severity.py --report audit.json --threshold 7.0

  pin-drift:
    name: exact-pin drift check (sqlglot, asteval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact pins agree with uv.lock
        run: python3 scripts/check_pin_drift.py

  drift-check:
    name: generated-artifact drift (NX-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen --extra dev
      - name: Regenerate and compare the committed NX-1 artifacts
        run: uv run python -m localdata_mcp.nexus.contract.check_drift

  battery-run-trailer:
    # NFR-506 batch-then-diagnose merge gate. For each fix commit in the
    # PR that touches bench-covered code, the checker requires a valid
    # Battery-Run: trailer and verifies the two conditions against the
    # canonical results store. The store is made durable across runs via
    # actions/cache: the prior canonical store is restored, this PR's
    # fresh run (the tests job's artifact — a run started AFTER the
    # commits) is merged in, and the cache is re-saved. On a cold cache
    # an antecedent run may be absent; the checker reports that as a
    # violation on a genuine fix, and a green baseline warms the cache.
    name: batch-then-diagnose gate (NFR-506)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen --extra dev
      - name: Restore the durable canonical results store
        uses: actions/cache@v4
        with:
          path: results-canonical.db
          key: results-store-${{ github.run_id }}
          restore-keys: |
            results-store-
      - name: Fetch this run's fresh battery results
        uses: actions/download-artifact@v4
        with:
          name: battery-results-${{ github.run_id }}
          path: fresh
      - name: Fold this run into the canonical store
        run: >
          uv run python scripts/merge_battery_results.py
          --canonical results-canonical.db "fresh/results-canonical.db"
      - name: Check every fix commit's Battery-Run trailer
        run: >
          uv run python scripts/check_battery_run_trailer.py
          --store results-canonical.db
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

  cold-start-smoke:
    # E8.6: process-launch -> serve-ready against the E8 import graph,
    # matplotlib font cache pre-seeded (the S8 row-17 measurement
    # condition). NON-GATING until E16.3's re-baseline (no --gate);
    # the 5.0 bound below is row 17's declared home (CI assertion).
    name: cold-start smoke (non-gating drift signal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen --extra dev
      - name: Measure cold start against the row-17 bound
        run: uv run python scripts/cold_start_smoke.py --bound 5.0
