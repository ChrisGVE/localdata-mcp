# v3 CI — gates for the NEW tree only (src/localdata_mcp/{nexus,ingest,
# explore,process,visualize,testbench} and tests/v3). Legacy packages are
# excluded from every job here until E15 deletes them; the legacy workflows
# keep serving main.
#
# Two numeric gates live HERE and only here (their single configuration home):
#   - coverage floor: 85 (--cov-fail-under below) — never restated in test code
#   - CVE gate: PR-blocking at CVSS >= 7.0 (--threshold below), all severities
#     reported by the checker script
name: v3 CI

on:
  push:
    branches: [v3, main]
  pull_request:
    branches: [v3, main]

env:
  UV_PYTHON: "3.12"

jobs:
  mypy:
    name: mypy (new paths, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen --extra dev
      - name: Type-check the v3 tree
        # The two server/ files are E2's new-tree modules living beside
        # legacy files (nexus/gated_tree.py GUARDED_EXTRA_FILES); the
        # rest of server/ stays legacy-excluded until E15.
        run: >
          uv run mypy
          src/localdata_mcp/nexus
          src/localdata_mcp/ingest
          src/localdata_mcp/explore
          src/localdata_mcp/process
          src/localdata_mcp/visualize
          src/localdata_mcp/testbench
          src/localdata_mcp/server/fd_guard.py
          src/localdata_mcp/server/mcp_app.py

  tests:
    name: pytest + coverage floor (new paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen --extra dev
      - name: Run the v3 suite with the coverage floor
        # The base battery's accreted slices (E8.5, incl. the generated
        # contract stubs), the domain battery's E10 slices, and the perf
        # smoke tier (E9.5's discovery floor) run per-PR alongside the
        # unit suite — S7.4's cadence; E14.3 adds the randomized mode
        # and the full nightly tier.
        run: >
          uv run pytest tests/v3/ src/localdata_mcp/testbench/batteries/base/
          src/localdata_mcp/testbench/batteries/domain/
          src/localdata_mcp/testbench/batteries/perf_memory/
          --cov=src/localdata_mcp/nexus
          --cov=src/localdata_mcp/ingest
          --cov=src/localdata_mcp/explore
          --cov=src/localdata_mcp/process
          --cov=src/localdata_mcp/visualize
          --cov=src/localdata_mcp/testbench
          --cov-report=term-missing
          --cov-fail-under=85

  pip-audit:
    name: dependency CVE gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export the locked dependency closure
        run: uv export --frozen --all-extras --no-emit-project -o requirements-audit.txt
      - name: Audit the locked closure
        # pip-audit exits non-zero on ANY finding; the threshold gate below
        # decides blocking, so findings must not fail this step directly.
        run: >
          uvx pip-audit -r requirements-audit.txt --no-deps -f json -o audit.json
          || echo "pip-audit reported findings; threshold gate decides"
      - name: Apply the CVSS threshold gate
        run: >
          uv run --no-project --with cvss python
          scripts/check_audit_severity.py --report audit.json --threshold 7.0

  pin-drift:
    name: exact-pin drift check (sqlglot, asteval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact pins agree with uv.lock
        run: python3 scripts/check_pin_drift.py

  drift-check:
    name: generated-artifact drift (NX-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen --extra dev
      - name: Regenerate and compare the committed NX-1 artifacts
        run: uv run python -m localdata_mcp.nexus.contract.check_drift

  batteries:
    name: battery bench (placeholder)
    runs-on: ubuntu-latest
    steps:
      - run: echo "placeholder until E3/E14 - the assembled battery bench lands in E14"

  cold-start-smoke:
    # E8.6: process-launch -> serve-ready against the E8 import graph,
    # matplotlib font cache pre-seeded (the S8 row-17 measurement
    # condition). NON-GATING until E16.3's re-baseline (no --gate);
    # the 5.0 bound below is row 17's declared home (CI assertion).
    name: cold-start smoke (non-gating drift signal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen --extra dev
      - name: Measure cold start against the row-17 bound
        run: uv run python scripts/cold_start_smoke.py --bound 5.0
